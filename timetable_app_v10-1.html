<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#245f78"><title>タイテアプリ v9</title>
<style>
:root{--bg:#f3f7f8;--card:#fff;--ink:#20323a;--muted:#718087;--accent:#246a82;--soft:#e2f1f5;--line:#dce7ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:24px}header{padding:22px 18px 18px;background:linear-gradient(135deg,#245f78,#3e91a4);color:white;border-radius:0 0 24px 24px}h1{font-size:25px;margin:4px 0}.sub{font-size:12px;opacity:.85}.main{padding:15px}.card{background:var(--card);border-radius:18px;padding:15px;margin-bottom:13px;box-shadow:0 3px 14px #1639470a}.monthbar,.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.monthbar{margin-bottom:12px}.monthbar button{background:var(--soft);color:var(--accent);border-radius:10px;padding:8px 14px;font-size:20px}.month{font-weight:800;font-size:18px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.weekday{font-size:11px;color:var(--muted);padding:5px 0}.day{border:0;background:transparent;color:var(--ink);min-height:44px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px}.day.out{color:#c3cdd1}.day.today{outline:2px solid var(--accent);font-weight:800}.day.selected{background:var(--accent);color:white}.dot{width:5px;height:5px;border-radius:50%;background:#e6a95f}.day.selected .dot{background:white}.title{font-size:16px;font-weight:800;margin:0 0 12px}.muted{font-size:13px;color:var(--muted);line-height:1.5}button{font:inherit;cursor:pointer;border:0}.primary{background:var(--accent);color:white;border-radius:12px;padding:11px 13px;font-weight:750}.secondary{background:var(--soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-weight:700}.danger{background:#fff0f0;color:#b34c55;border-radius:10px;padding:7px 9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}textarea,input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;font:inherit;color:var(--ink);background:white}textarea{min-height:90px;resize:vertical}.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:10px}.tile{position:relative;aspect-ratio:1;overflow:hidden;border-radius:10px;background:var(--soft)}.tile img{width:100%;height:100%;object-fit:cover}.tile button{position:absolute;right:4px;top:4px;background:#17252ccc;color:white;border-radius:10px;padding:4px 6px;font-size:11px}.placeholder{border:1px dashed #b9d0d8;border-radius:13px;padding:18px;text-align:center;color:var(--muted);font-size:13px}.viewer{position:fixed;inset:0;background:#101a20f5;z-index:10;display:none;align-items:center;justify-content:center;padding:12px;flex-direction:column;gap:12px}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:83vh;width:auto;height:auto;object-fit:contain}.viewer .row{justify-content:center;flex-wrap:wrap}.viewer button{background:white;color:#20323a;border-radius:11px;padding:10px 13px}.foot{text-align:center;color:var(--muted);font-size:11px;padding:0 15px 15px}
</style></head><body><div class="app"><header><div class="sub">LIVE TIMETABLE CALENDAR</div><h1>タイテアプリ v9</h1><div class="sub">日付ごとにタイテ写真とメモを保存</div></header><main class="main"><section class="card"><div class="monthbar"><button id="prev">‹</button><div id="month" class="month"></div><button id="next">›</button></div><div class="calendar" id="calendar"></div></section><section class="card"><div class="row"><h2 id="dateTitle" class="title">日付</h2><button class="secondary" id="today">今日へ</button></div><div class="actions" style="margin:0 0 16px"><button class="primary" id="timetable">タイテ</button></div><h3 class="title">メモ</h3><textarea id="memo" placeholder="出演グループ、会場、時間、気になることなど"></textarea><div class="actions"><button class="primary" id="saveMemo">メモを保存</button></div><hr style="border:0;border-top:1px solid var(--line);margin:17px 0"><div class="row"><h3 class="title" style="margin:0">タイテ写真</h3><span id="count" class="muted">0枚</span></div><p class="muted">写真を選ぶと自動で保存されます。</p><input id="files" type="file" accept="image/*" multiple style="margin-top:8px"><div id="photos" class="photo-grid"></div></section></main><div class="foot">このブラウザ内に記録を保存します。元の「推し活ログ」とは別の保存領域です。</div></div><div class="viewer" id="viewer"><img id="viewerImg" alt="タイテ写真"><div class="row"><button id="prevPhoto">← 前へ</button><button id="closeViewer" aria-label="カレンダーに戻る">カレンダーに戻る</button><button id="nextPhoto">次へ →</button></div></div>
<script>
const $=id=>document.getElementById(id);function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function save(){localStorage.setItem('timetable_app_data',JSON.stringify(data))}const now=new Date();let shown=new Date(now.getFullYear(),now.getMonth(),1),selected=iso(now),photosForViewer=[],viewerIndex=0;let data;try{data=JSON.parse(localStorage.getItem('timetable_app_data')||'{"dates":{},"photos":[]}')}catch{data={dates:{},photos:[]}}if(!data.dates)data.dates={};if(!data.photos)data.photos=[];
const dbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('oshilog_photos_v11',1);req.onupgradeneeded=()=>req.result.createObjectStore('images');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
async function putImage(id,blob){const db=await dbPromise;return new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
async function getImage(id){const db=await dbPromise;return new Promise((res,rej)=>{const tx=db.transaction('images','readonly');const r=tx.objectStore('images').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function delImage(id){try{const db=await dbPromise;return await new Promise((res,rej)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){return}}
async function imageURL(id){const item=data.photos.find(p=>p.id===id);if(item&&item.dataUrl)return item.dataUrl;try{const blob=await getImage(id);return blob?URL.createObjectURL(blob):''}catch(e){return ''}}
async function makeSmallDataURL(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onerror=()=>reject(fr.error||new Error('画像を読み込めません'));fr.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('画像を開けません'));img.onload=()=>{try{const max=1500,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',0.78))}catch(e){reject(e)}};img.src=fr.result};fr.readAsDataURL(file)})}

function renderCalendar(){ $('month').textContent=`${shown.getFullYear()}年${shown.getMonth()+1}月`;const c=$('calendar');c.innerHTML='';['日','月','火','水','木','金','土'].forEach(x=>{const d=document.createElement('div');d.className='weekday';d.textContent=x;c.append(d)});const first=new Date(shown.getFullYear(),shown.getMonth(),1),start=new Date(first);start.setDate(first.getDate()-first.getDay());for(let i=0;i<42;i++){const dt=new Date(start);dt.setDate(start.getDate()+i);const key=iso(dt),b=document.createElement('button');b.className='day'+(dt.getMonth()!==shown.getMonth()?' out':'')+(key===iso(now)?' today':'')+(key===selected?' selected':'');b.innerHTML=`<span>${dt.getDate()}</span>${(data.dates[key]?.memo||data.photos.some(p=>p.date===key))?'<i class="dot"></i>':''}`;b.onclick=()=>{selected=key;renderCalendar();renderDate()};c.append(b)}}
async function renderDate(){ $('dateTitle').textContent=`${selected.replaceAll('-','/')} の記録`;const entry=data.dates[selected]||{};$('memo').value=entry.memo||'';const list=data.photos.filter(p=>p.date===selected).sort((a,b)=>a.addedAt-b.addedAt);$('count').textContent=`${list.length}枚`;$('photos').innerHTML='';if(!list.length){$('photos').innerHTML='<div class="placeholder" style="grid-column:1/-1">タイテ写真はまだありません</div>';return}for(let i=0;i<list.length;i++){const p=list[i],tile=document.createElement('div');tile.className='tile';const im=document.createElement('img');im.alt=p.name;im.src=await imageURL(p.id);tile.append(im);const del=document.createElement('button');del.textContent='削除';del.onclick=async e=>{e.stopPropagation();if(confirm('このタイテ写真を削除しますか？')){data.photos=data.photos.filter(x=>x.id!==p.id);await delImage(p.id);save();renderCalendar();renderDate()}};tile.append(del);tile.onclick=()=>openViewer(list,i);$('photos').append(tile)}}
async function openViewer(list,i){photosForViewer=list;viewerIndex=i;await showViewer()}async function showViewer(){const p=photosForViewer[viewerIndex];if(!p)return;$('viewerImg').src=await imageURL(p.id);$('viewer').classList.add('open');$('prevPhoto').style.visibility=photosForViewer.length>1?'visible':'hidden';$('nextPhoto').style.visibility=photosForViewer.length>1?'visible':'hidden'}
$('prev').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);renderCalendar()};$('next').onclick=()=>{shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);renderCalendar()};$('today').onclick=()=>{selected=iso(now);shown=new Date(now.getFullYear(),now.getMonth(),1);renderCalendar();renderDate()};$('saveMemo').onclick=()=>{const memo=$('memo').value.trim();if(memo)data.dates[selected]={...(data.dates[selected]||{}),memo};else if(data.dates[selected]){delete data.dates[selected].memo;if(!Object.keys(data.dates[selected]).length)delete data.dates[selected]}save();renderCalendar();alert('メモを保存したよ')};$('files').addEventListener('change',async()=>{const input=$('files');const files=[...(input.files||[])];if(!files.length)return;let saved=0;let errorMessage='';for(const f of files){if(!f.type.startsWith('image/')&&!/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name)){errorMessage='画像ファイルとして認識できませんでした';continue}const id='tt'+Date.now()+Math.random().toString(16).slice(2);try{let storedInDb=false;try{await putImage(id,f);storedInDb=true}catch(dbErr){console.warn('IndexedDB unavailable; using compact local fallback',dbErr)}const record={id,date:selected,name:f.name,addedAt:Date.now()};if(!storedInDb){record.dataUrl=await makeSmallDataURL(f)}data.photos.push(record);try{save()}catch(storageErr){data.photos=data.photos.filter(p=>p.id!==id);if(storedInDb){try{await delImage(id)}catch(_){}}throw new Error('ブラウザの保存容量が足りません。写真を小さくするか、枚数を減らしてください。')}saved++}catch(e){console.error('タイテ写真の保存エラー',e);errorMessage=(e&&e.name?e.name+': ':'')+(e?.message||String(e)||'ブラウザの保存機能が利用できません');break}}input.value='';renderCalendar();await renderDate();if(errorMessage)alert(`写真を保存できませんでした。\n原因：${errorMessage}\n`);else if(saved)alert(`${saved}枚のタイテ写真を保存したよ`)});$('timetable').onclick=()=>{const list=data.photos.filter(p=>p.date===selected).sort((a,b)=>a.addedAt-b.addedAt);if(!list.length){alert('この日のタイテ写真がまだないよ。先に写真を取り込んでね。');return}openViewer(list,0)};function closeViewer(){ $('viewer').classList.remove('open'); } $('closeViewer').onclick=closeViewer; $('viewer').addEventListener('click',e=>{if(e.target===$('viewer'))closeViewer()});$('prevPhoto').onclick=()=>{viewerIndex=(viewerIndex-1+photosForViewer.length)%photosForViewer.length;showViewer()};$('nextPhoto').onclick=()=>{viewerIndex=(viewerIndex+1)%photosForViewer.length;showViewer()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeViewer()}); window.addEventListener('popstate',()=>{if($('viewer').classList.contains('open'))closeViewer()});renderCalendar();renderDate();
</script></body></html>
